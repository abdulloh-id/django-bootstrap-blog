{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<main class="section py-5"> 
    <div class="container"> 
        <div class="row justify-content-center"> 
            <div class="col-lg-8 col-md-10 col-sm-12">
                <div class="card shadow-sm border-danger">
                    <div class="card-header bg-danger text-white">
                        <h2 class="card-title mb-0 text-center">
                            <i class="ti-trash mr-2"></i> {% trans "Delete Post" %}
                        </h2>
                    </div>
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            <p class="lead">
                                {% blocktranslate with title=object.title %}
                                    Are you sure you want to delete the post "<strong>{{ title }}</strong>"? This action cannot be undone.
                                {% endblocktranslate %}
                            </p>
                            <div class="d-flex justify-content-end mt-4">
                                <button type="button" class="btn btn-outline-secondary mr-2" onclick="history.back()">
                                    {% trans "Cancel" %}
                                </button>
                                <button type="submit" class="btn btn-danger">
                                    <i class="ti-trash mr-1"></i> {% trans "Yes, Delete" %}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock content %}
